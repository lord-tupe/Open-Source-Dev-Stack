.pipeline-step:not(:last-child)::after{content:'\f178';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:50%;right:-11px;transform:translateY(-50%);color:var(--primary);z-index:2;font-size:10px}
.pipeline-num{width:24px;height:24px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:800}
.pipeline-name{font-size:10px;font-weight:700;line-height:1.35}.pipeline-desc{margin-top:4px;color:var(--muted);font-size:9px}
.license-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.notice i{color:var(--info);margin-top:1px;flex-shrink:0}.notice span{overflow-wrap:anywhere}.notice-warning{background:var(--warning-soft);border-color:rgba(246,199,96,.16)}.notice-warning i{color:var(--warning)}
.resource-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resource-card{padding:17px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);min-width:0}.resource-card h3{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}.resource-card h3 i{color:var(--primary)}
.resource-list{margin:11px 0 0;padding:0;list-style:none;display:grid;gap:9px}.resource-list li{display:flex;gap:8px;align-items:flex-start;color:var(--text-2);font-size:11px;min-width:0}.resource-list li i{color:var(--success);margin-top:2px;flex-shrink:0}.resource-list span{overflow-wrap:anywhere}.resource-list strong{color:var(--text)}
.resource-callout{margin-top:14px;padding:13px;border:1px solid rgba(50,216,244,.16);background:var(--primary-soft);border-radius:11px}
.resource-callout h4{margin:0 0 5px;font-size:11px;color:var(--primary);display:flex;align-items:center;gap:8px}
.resource-callout p{margin:0;color:var(--text-2);font-size:10px}
.eco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.eco-branch{padding:16px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface-2);transition:border-color var(--transition);min-width:0}.eco-branch:hover{border-color:var(--border-strong)}
.eco-branch-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.eco-tools{display:flex;flex-wrap:wrap;gap:4px}
.eco-tool-btn{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--text-2);border:1px solid transparent;cursor:pointer;transition:all var(--transition)}
.eco-tool-btn:hover{border-color:var(--border-strong);color:var(--text)}
.flow-container{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.flow-step{padding:10px 14px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:500;text-align:center;max-width:100%;overflow-wrap:anywhere}
.flow-arrow{color:var(--muted);flex-shrink:0}
.lifecycle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.lifecycle-card h4{margin:0 0 6px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.lifecycle-card h4 i{color:var(--primary)}
.lifecycle-card p{margin:0 0 8px;font-size:11px;color:var(--muted)}
.lifecycle-tools{font-size:11px;color:var(--text-2)}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.pattern-card{padding:18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);min-width:0}
.pattern-card h3{margin:0 0 6px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pattern-card h3 i{color:var(--primary)}
.pattern-card p{margin:0 0 12px;font-size:11px;color:var(--muted);line-height:1.5}
.pattern-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.pattern-col-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.pattern-item{font-size:11px;color:var(--text-2);display:flex;align-items:start;gap:4px;margin-bottom:2px}
.level-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);border-left:3px solid var(--primary)}
.level-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.level-num{width:36px;height:36px;border-radius:var(--radius-md);display:grid;place-items:center;font-size:16px;font-weight:700}
.level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

.project-card h4{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.project-meta{display:flex;flex-direction:column;gap:4px}
.project-meta span{font-size:11px;color:var(--text-2);overflow-wrap:anywhere}
.project-meta strong{color:var(--muted);font-weight:500}
.cost-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cost-card{padding:18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);min-width:0}
.cost-card h3{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.cost-card h3 i{color:var(--primary)}
.cost-item{font-size:12px;color:var(--text-2);padding-left:12px;border-left:2px solid var(--border);margin-bottom:6px;overflow-wrap:anywhere}
.progress-btns{display:flex;gap:4px;flex-wrap:wrap}
.progress-btn{padding:3px 8px;border-radius:var(--radius-sm);font-size:10px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all var(--transition)}
.progress-btn:hover{border-color:var(--border-strong);color:var(--text)}
.progress-btn.active{border-color:rgba(50,216,244,.3);background:var(--primary-soft);color:var(--primary)}
.empty{padding:44px 18px;text-align:center}.empty-icon{width:44px;height:44px;margin:0 auto 11px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted-2)}
.empty h3{margin:0;font-size:14px}.empty p{margin:5px 0 0;color:var(--muted);font-size:11px}
.toast-region{position:fixed;right:18px;right:max(18px,env(safe-area-inset-right));bottom:18px;bottom:max(18px,env(safe-area-inset-bottom));z-index:140;display:grid;gap:8px;width:min(360px,calc(100vw - 36px))}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-md);animation:toast-in 180ms ease}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast i{margin-top:2px;color:var(--success)}.toast p{margin:0;color:var(--text-2);font-size:11px;overflow-wrap:anywhere}.toast button{margin-left:auto;color:var(--muted);border:0;background:transparent;cursor:pointer}
.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.selfhost-table{min-width:800px}
.error-boundary{padding:24px;margin:20px 0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.error-boundary h3{margin:0 0 8px;font-size:14px}
.error-boundary p{margin:0 0 14px;color:var(--muted);font-size:12px}
@media(max-width:1180px){:root{--sidebar:248px}.toolbar-grid{grid-template-columns:1.25fr 1fr 1fr}.toolbar-grid>:first-child{grid-column:span 3}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-grid{grid-template-columns:1fr}.landscape-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pipeline{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pipeline-step:not(:last-child)::after{display:none}}

@media(max-width:680px){:root{--topbar:62px}.topbar{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));gap:8px}.breadcrumbs{display:none}.global-search{order:2;flex:1;width:auto}.topbar-actions{order:3}.main-content{padding:20px 14px 42px}.page-head{align-items:flex-start;flex-direction:column;margin-bottom:18px}.page-context{display:none}.hero-panel{padding:18px}.metric-grid{gap:8px}.metric-card{min-height:96px;padding:13px}.metric-value{font-size:20px}.toolbar-grid{grid-template-columns:1fr 1fr}.toolbar-grid>:first-child{grid-column:span 2}.toolbar-footer{align-items:flex-start;flex-direction:column}.directory-table{display:none}.mobile-tool-list{display:block}.landscape-grid{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr 1fr}.stack-nav{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.shortcut{display:none}.flow-container{flex-direction:column}.flow-arrow{transform:rotate(90deg)}.pattern-cols{grid-template-columns:1fr}.site-footer{padding:14px 16px}}
@media(max-width:460px){.search-input{padding-left:34px;padding-right:10px}.topbar-actions .icon-button:first-child{display:none}.hero-actions .btn{width:100%}.metric-grid{grid-template-columns:1fr 1fr}.metric-note{display:none}.toolbar-grid{grid-template-columns:1fr}.toolbar-grid>:first-child{grid-column:auto}.pipeline{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

const TOOLS=[
{id:'vscode',name:'Visual Studio Code',category:CATEGORIES.IDE,website:'https://code.visualstudio.com/',github:'https://github.com/microsoft/vscode',licenseType:LICENSES.OC,license:'MIT (Core) / Proprietary (Binaries)',desc:'Extensible, ubiquitous code editor with a massive extension marketplace, integrated terminal, Git support, and debugging.',capabilities:['Extension marketplace','Integrated terminal','Git integration','Debugging','IntelliSense','Remote development','Multi-root workspaces'],selfHosted:'N/A',cloud:'N/A',architecture:'Electron / TypeScript',strengths:'Massive ecosystem and broad language support. Free and open source core. Cross-platform with active Microsoft backing.',tradeoffs:'Can be resource-heavy with large extension sets. Electron-based memory usage. Telemetry concerns (can be disabled).',sdlc:['IDE / Editor'],bestFor:'General-purpose development across any language or framework',learningCurve:'Low'},
{id:'eclipse',name:'Eclipse',category:CATEGORIES.IDE,website:'https://eclipseide.org/',github:'https://github.com/eclipse-platform',licenseType:LICENSES.OSI,license:'EPL 2.0',desc:'Classic Java-centric IDE with a mature plugin ecosystem and enterprise tooling.',capabilities:['Java development','Plugin architecture','Build tools integration','Debugging','Version control','Enterprise frameworks'],selfHosted:'N/A',cloud:'N/A',architecture:'Java',strengths:'Deep Java integration and mature tooling. Free and open source. Enterprise-grade with extensive plugin system.',tradeoffs:'Heavier workflow and a less minimal interface. Declining community compared to VS Code. Steep learning curve for beginners.',sdlc:['IDE / Editor'],bestFor:'Enterprise Java development and legacy projects',learningCurve:'Medium'},
{id:'netbeans',name:'Apache NetBeans',category:CATEGORIES.IDE,website:'https://netbeans.apache.org/',github:'https://github.com/apache/netbeans',licenseType:LICENSES.OSI,license:'Apache 2.0',desc:'Apache-maintained IDE for Java, PHP, and web development with built-in Maven and Gradle support.',capabilities:['Java SE/EE','Maven / Gradle','PHP support','HTML5/CSS','Code templates','Refactoring'],selfHosted:'N/A',cloud:'N/A',architecture:'Java',strengths:'Apache-backed with strong out-of-box experience. Good Java EE support. Lighter than Eclipse.',tradeoffs:'Smaller extension ecosystem than VS Code. Less community activity. Fewer extensions available.',sdlc:['IDE / Editor'],bestFor:'Java development and Apache ecosystem users',learningCurve:'Medium'},
{id:'aider',name:'Aider',category:CATEGORIES.AI_TERM,website:'https://aider.chat/',github:'https://github.com/Aider-AI/aider',licenseType:LICENSES.OSI,license:'Apache 2.0',desc:'Terminal-based AI pair programmer that works directly in your Git repository with repo-aware editing.',capabilities:['Repo-aware editing','Auto-commits','Multi-file edit','LLM integration','Codebase context','Multiple model support'],selfHosted:'Local CLI',cloud:'Uses API keys',architecture:'Python CLI',strengths:'Fast repo-aware workflow with Git integration. Works in terminal. Supports many LLMs. Automatic git commits.',tradeoffs:'Terminal-first experience is less visual than IDE agents. Requires API keys (cost). Depends on external LLM quality.',sdlc:['AI Coding','Planning & Implementation'],bestFor:'Terminal-focused developers wanting AI pair programming with Git integration',learningCurve:'Low-Medium'},
{id:'opencode',name:'OpenCode',category:CATEGORIES.AI_TERM,website:'https://opencode.ai/',github:'https://github.com/anomalyco/opencode',licenseType:LICENSES.OSI,license:'MIT',desc:'Open-source terminal AI coding agent for interactive code editing and generation.',capabilities:['Code generation','Terminal execution','File editing','LLM integration'],selfHosted:'Local CLI',cloud:'Uses API keys',architecture:'TypeScript / CLI',strengths:'Open ecosystem and terminal-native control. Lightweight and simple interface.',tradeoffs:'The tool and surrounding ecosystem evolve quickly. Requires API keys. Less feature-rich than Aider.',sdlc:['AI Coding'],bestFor:'Developers wanting a minimal terminal AI coding tool',learningCurve:'Low'},
{id:'cline',name:'Cline',category:CATEGORIES.AI_IDE,website:'https://cline.bot/',github:'https://github.com/cline/cline',licenseType:LICENSES.OSI,license:'Apache 2.0',desc:'Agentic coding assistant inside VS Code with terminal access, file editing, and browser interaction capabilities.',capabilities:['Executes commands','Reads / writes files','Browser automation','Multi-step tasks','Human approval gates','Multiple model support'],selfHosted:'Local extension',cloud:'Uses API keys',architecture:'TypeScript extension',strengths:'Strong repository and terminal workflows inside the editor. Autonomous execution with human-in-the-loop. Can use browser.',tradeoffs:'VS Code only. Agentic changes need review and good permissions hygiene. API costs. Requires configuration.',sdlc:['AI Coding','Testing'],bestFor:'VS Code users wanting an autonomous AI agent for multi-step development tasks',learningCurve:'Medium'},
{id:'continue',name:'Continue',category:CATEGORIES.AI_IDE,website:'https://www.continue.dev/',github:'https://github.com/continuedev/continue',licenseType:LICENSES.OSI,license:'Apache 2.0',desc:'Open-source AI code assistant for VS Code and JetBrains with support for local and cloud models.',capabilities:['Chat','Autocomplete','Inline edit','Context-aware','Local model support','Custom configurations','Multi-IDE support'],selfHosted:'Local extension + local models',cloud:'API keys',architecture:'TypeScript',strengths:'Highly configurable model and workflow support. Works in VS Code and JetBrains. Supports local models.',tradeoffs:'Best results require some configuration and model selection. Quality depends on model choice.',sdlc:['AI Coding'],bestFor:'Developers wanting a configurable AI assistant across multiple IDEs with local model support',learningCurve:'Medium'},
{id:'tabby',name:'Tabby',category:CATEGORIES.AI_INLINE,website:'https://tabby.tabbyml.com/',github:'https://github.com/TabbyML/tabby',licenseType:LICENSES.OSI,license:'Apache 2.0',desc:'Self-hosted AI coding assistant server providing code completions and chat, designed for enterprise privacy.',capabilities:['Autocomplete','Private hosting','Code completion','Admin panel','Multiple model backends','Enterprise features'],selfHosted:'Local server',cloud:'Managed options available',architecture:'Rust / ML stack',strengths:'Private, controllable coding assistance. Fully self-hostable. Enterprise-ready with admin dashboard.',tradeoffs:'Self-hosting requires suitable compute for strong local models. GPU recommended for performance. Server maintenance needed.',sdlc:['AI Coding'],bestFor:'Organizations wanting a self-hosted, privacy-focused AI coding assistant',learningCurve:'Medium-High'},
{id:'openhands',name:'OpenHands',category:CATEGORIES.AI_AUTO,website:'https://www.all-hands.dev/',github:'https://github.com/All-Hands-AI/OpenHands',licenseType:LICENSES.OSI,license:'MIT',desc:'Autonomous AI software engineering platform that can plan, write, test, and ship code in an isolated sandboxed environment.',capabilities:['Sandboxed execution','Web browsing','Terminal access','Iterative fixing','Autonomous planning','Repository inspection','Testing','Debugging'],selfHosted:'Local container runtime',cloud:'Managed offerings vary',architecture:'Python / containerised runtime',strengths:'Designed for multi-step engineering tasks and iterative execution. Fully autonomous development in sandboxed environment. Web interface.',tradeoffs:'Agentic workflows can consume substantial compute and model tokens. Output needs human review. Not a replacement for senior engineers.',sdlc:['AI Coding','Testing','Maintenance'],bestFor:'Automating repetitive development tasks, prototyping, and augmenting engineering teams',learningCurve:'Medium'},
{id:'gitlab',name:'GitLab',category:CATEGORIES.SCM,website:'https://gitlab.com/',github:'https://github.com/gitlabhq/gitlabhq',licenseType:LICENSES.OC,license:'MIT (CE) / Proprietary (EE)',desc:'Complete DevOps platform providing Git repositories, CI/CD, issue tracking, merge requests, container registry, and security scanning.',capabilities:['Git repositories','CI/CD pipelines','Issue tracking','Merge requests','Container registry','Security scanning','Package registry','Wiki','Project boards','Self-hosting'],selfHosted:'Docker / Omnibus / source',cloud:'GitLab.com',architecture:'Ruby / Go',strengths:'Broad DevOps lifecycle coverage in one product. Excellent CI/CD. Self-hostable. Security features built-in.',tradeoffs:'Self-hosting needs meaningful compute and operations capacity. Complex administration. EE features are proprietary.',sdlc:['Source Control','Build System'],bestFor:'Teams wanting a complete, self-hostable DevOps platform with integrated CI/CD and security',learningCurve:'Medium'},
{id:'sonarqube',name:'SonarQube Community',category:CATEGORIES.SEC,website:'https://www.sonarsource.com/products/sonarqube/',github:'https://github.com/SonarSource/sonarqube',licenseType:LICENSES.OC,license:'LGPL v3 (Community)',desc:'Continuous code quality and security inspection tool detecting bugs, vulnerabilities, and code smells across 30+ languages.',capabilities:['Static analysis','Code smells','Quality gates','Bug detection','Vulnerability detection','Security hotspots','CI/CD integration','Multi-language'],selfHosted:'Docker / Java',cloud:'SonarQube Cloud',architecture:'Java',strengths:'Broad analysis coverage and quality-gate workflow. Wide language support. Community edition is free.',tradeoffs:'Heavier than lightweight CLI-only scanning. Resource-intensive. Enterprise features are paid. Can produce false positives.',sdlc:['Code Quality & Security'],bestFor:'Teams wanting automated code quality and security analysis in CI/CD pipelines',learningCurve:'Medium'},
{id:'semgrep',name:'Semgrep',category:CATEGORIES.SEC,website:'https://semgrep.dev/',github:'https://github.com/semgrep/semgrep',licenseType:LICENSES.OC,license:'LGPL 2.1 (CLI)',desc:'Fast static analysis for bugs and security patterns using expressive pattern-based code searching across 30+ languages.',capabilities:['Custom rules','Fast scans','CI integration','SAST','Pre-commit hooks','Multi-language','Security rules'],selfHosted:'Local CLI',cloud:'Managed dashboard',architecture:'OCaml',strengths:'Fast feedback and expressive rule authoring. Custom rule creation. CI/CD friendly. Pre-commit integration.',tradeoffs:'Some advanced workflows depend on managed features. Requires rule knowledge. Can miss complex patterns.',sdlc:['Code Quality & Security'],bestFor:'Teams wanting fast, customizable static analysis and security scanning',learningCurve:'Medium'},

// Clipboard helper with graceful fallback for non-secure contexts and older browsers.
async function copyText(text){
  try{
    if(typeof navigator!=='undefined'&&navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch{}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.top='-1000px';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch{return false;}
}

}

function usePersistedState(key,fallback){
  const[value,setValue]=useState(()=>{
    try{
      const raw=localStorage.getItem(key);
      if(raw===null)return fallback;
      const parsed=JSON.parse(raw);
      return parsed===undefined||parsed===null?fallback:parsed;
    }catch{return fallback;}
  });
  useEffect(()=>{
    try{localStorage.setItem(key,JSON.stringify(value));}catch{}
  },[key,value]);
  return[value,setValue];
}

function useTheme(){
  const[theme,setTheme]=usePersistedState('dev-stack-theme','dark');
  useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);
  return[theme,setTheme];
}

// Error boundary so a single view failure cannot take down the whole canvas.
class ErrorBoundary extends Component{
  constructor(props){super(props);this.state={hasError:false};}
  static getDerivedStateFromError(){return{hasError:true};}
  componentDidCatch(error,info){try{console.error('View error:',error,info);}catch{}}
  handleRetry=()=>this.setState({hasError:false});
  render(){
    if(this.state.hasError){
      return <div className="error-boundary" role="alert">
        <h3>This section could not be displayed.</h3>
        <p>The rest of the canvas is still available. You can retry this section or continue using another view.</p>
        <button className="btn btn-secondary" onClick={this.handleRetry}>{icon('fa-rotate-left')}Retry</button>
      </div>;
    }
    return this.props.children;
  }
}

  const[hosting,setHosting]=useState('All');

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    const rows=tools.filter(t=>{
      const matchSearch=!q||(t._hay&&t._hay.includes(q));
      const matchCat=category==='All'||t.category===category;
      const matchLicense=license==='All'||t.licenseType===license;
      const matchHosting=hosting==='All'||(hosting==='Self-hosted'?!['N/A',''].includes(t.selfHosted):!['N/A',''].includes(t.cloud));
      const matchFav=!onlyFavorites||favorites.includes(t.id);
      return matchSearch&&matchCat&&matchLicense&&matchHosting&&matchFav;
    });
    return[...rows].sort((a,b)=>{const av=(a[sortBy]||'').toString().toLowerCase();const bv=(b[sortBy]||'').toString().toLowerCase();return av.localeCompare(bv)*(sortDir==='asc'?1:-1);});
  },[tools,search,category,license,hosting,favorites,onlyFavorites,sortBy,sortDir]);

function ToolDrawer({tool,favorite,onFavorite,onClose,onToast,learningProgress,setProgress}){
  const drawerRef=useRef(null);
  const closeRef=useRef(null);

  useEffect(()=>{
    const previouslyFocused=document.activeElement;
    if(closeRef.current)closeRef.current.focus();
    const handleKey=(e)=>{
      if(e.key==='Escape'){e.preventDefault();onClose();return;}
      if(e.key!=='Tab'||!drawerRef.current)return;
      const focusables=drawerRef.current.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
      if(!focusables.length)return;
      const first=focusables[0];
      const last=focusables[focusables.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    };
    document.addEventListener('keydown',handleKey);
    return()=>{
      document.removeEventListener('keydown',handleKey);
      if(previouslyFocused&&typeof previouslyFocused.focus==='function'){try{previouslyFocused.focus();}catch{}}
    };
  },[onClose]);

  const copy=async()=>{
    const text=`${tool.name}\n${tool.desc}\nCategory: ${tool.category}\nLicense: ${tool.license}\nArchitecture: ${tool.architecture}`;
    const ok=await copyText(text);
    onToast(ok?'Tool summary copied.':'Copy failed. Please select and copy manually.');
  };

  const progress=learningProgress[tool.id]||'';

  return<>
    <button className="drawer-backdrop"aria-label="Close"onClick={onClose}></button>
    <aside className="drawer"role="dialog"aria-modal="true"aria-labelledby="tool-drawer-title"ref={drawerRef}>
      <div className="drawer-header">
        <div className="drawer-title-row">
          <span className="drawer-tool-icon">{icon(tool.category.startsWith('AI')?'fa-microchip':tool.category===CATEGORIES.SEC?'fa-shield-halved':tool.category===CATEGORIES.IDE?'fa-code':'fa-cube')}</span>
          <div style={{minWidth:0}}><h2 id="tool-drawer-title"className="drawer-title">{tool.name}</h2><p className="drawer-desc">{tool.category}</p></div>
        </div>
        <button className="icon-button"aria-label="Close"onClick={onClose}ref={closeRef}>{icon('fa-xmark')}</button>
      </div>
      <div className="drawer-body">
        <p style={{margin:0,color:'var(--text-2)',fontSize:13,lineHeight:1.65,overflowWrap:'anywhere'}}>{tool.desc}</p>
        <div className="detail-section"><p className="detail-label">Core profile</p><div className="detail-grid">
          <Detail label="Architecture"value={tool.architecture}/>
          <Detail label="Licence"value={tool.license}/>
          <Detail label="Self-hosting"value={tool.selfHosted}/>
          <Detail label="Managed cloud"value={tool.cloud}/>
          {tool.bestFor&&<Detail label="Best for"value={tool.bestFor}/>}
          {tool.learningCurve&&<Detail label="Learning curve"value={tool.learningCurve}/>}
        </div></div>
        <div className="detail-section"><p className="detail-label">Capabilities</p><div className="capability-list">{tool.capabilities.map(c=><span className="badge badge-blue"key={c}>{c}</span>)}</div></div>
        <div className="detail-section"><p className="detail-label">Software delivery coverage</p><div className="capability-list">{tool.sdlc.map(c=><span className="badge badge-slate"key={c}>{c}</span>)}</div></div>
        <div className="detail-section"><p className="detail-label">Strengths</p><div className="detail-note">{tool.strengths}</div></div>
        <div className="detail-section"><p className="detail-label">Trade-offs</p><div className="detail-note">{tool.tradeoffs}</div></div>
        <div className="detail-section">
          <p className="detail-label">Track your progress</p>
          <div className="progress-btns">
            {['not-started','learning','used','comfortable','advanced'].map(s=><button key={s}className={`progress-btn ${progress===s?'active':''}`}onClick={()=>setProgress(tool.id,s)}>{s==='not-started'?'Not Started':s.charAt(0).toUpperCase()+s.slice(1)}</button>)}
          </div>
        </div>
        <div className="notice"style={{marginTop:18}}>{icon('fa-circle-info')}<span>Licensing labels are a planning aid. Review the project's current licence before making production or commercial decisions.</span></div>
        <div className="detail-actions">
          <button className="btn btn-primary"onClick={onFavorite}>{icon('fa-star')}{favorite?'Saved':'Save tool'}</button>
          <button className="btn btn-secondary"onClick={copy}>{icon('fa-copy')}Copy summary</button>
          {tool.website&&<a className="btn btn-secondary"href={tool.website}target="_blank"rel="noopener noreferrer">{icon('fa-globe')}Official site</a>}
          {tool.github&&<a className="btn btn-secondary"href={tool.github}target="_blank"rel="noopener noreferrer">{icon('fa-brands fa-github')}GitHub</a>}
        </div>
      </div>
    </aside>
  </>;
}

          <Resource title="Typical constraints"items={['Limited or expensive bandwidth','Intermittent power and connectivity','Low-cost laptops, small servers or entry-level VPS plans','Small teams that need clear operational ownership']}iconName="fa-triangle-exclamation"/>
          <Resource title="Architectural responses"items={['Prefer simple deployment topologies over unnecessary microservices','Keep frontends lean and consider offline-first patterns','Use managed services selectively when they remove operational burden','Back up data locally and remotely with explicit recovery procedures']}iconName="fa-gears"/>
        </div>
      </div>
    </div>
    <div className="resource-grid"style={{marginBottom:18}}>
      <div className="panel panel-body">
        <h3 style={{margin:'0 0 5px',fontSize:14}}>Compact backend pattern</h3>
        <p className="muted"style={{margin:'0 0 10px',fontSize:11}}>PocketBase is a useful example when one binary, a local SQLite store and straightforward admin tooling meet the application requirements.</p>
        <div className="resource-callout"><h4>{icon('fa-check')}Keep the topology understandable</h4><p>For small deployments, fewer moving parts can materially reduce support overhead. Scale the architecture when the workload actually needs it.</p></div>
      </div>
      <div className="panel panel-body">
        <h3 style={{margin:'0 0 5px',fontSize:14}}>Frontend pattern</h3>
        <p className="muted"style={{margin:'0 0 10px',fontSize:11}}>Prefer compressed assets, modest JavaScript payloads, resilient caching and clear offline/error states when connectivity is unreliable.</p>
        <div className="resource-callout"><h4>{icon('fa-wifi')}Design for the connection you have</h4><p>Optimise the critical path first. A fast, resilient application is usually more valuable than a larger feature set that assumes perfect connectivity.</p></div>
      </div>
    </div>
    <div className="resource-grid">
      <Resource title="When PocketBase makes sense"items={['Single binary: no complex setup, works on minimal VPS','Low resources: runs on 256MB RAM','Offline development: everything local, no external dependencies','Easy deployment: copy one file to server','Best for: Prototypes, small apps, NGOs, local SMEs']}iconName="fa-check"/>
      <Resource title="When managed services make sense"items={['Supabase Cloud: free tier, no server management','Reduces operational burden: no backups, updates, patching','Better for small teams: focus on product, not infrastructure','Consideration: Requires internet connectivity','Best for: Startups, small teams, projects where ops time exceeds cloud cost']}iconName="fa-cloud"/>
    </div>
  </>;
}
function Resource({title,items,iconName}){return<div className="resource-card"><h3>{icon(iconName)}{title}</h3><ul className="resource-list">{items.map((item,i)=><li key={i}>{icon('fa-check')}<span>{item}</span></li>)}</ul></div>;}

function ComparisonView(){
  return<>
    <div className="panel"style={{padding:4,marginBottom:18}}>
      <div className="table-wrap"style={{border:'none'}}>
        <table>
          <thead><tr><th>Tool</th><th>Category</th><th>Self-Host</th><th>Database</th><th>Auth</th><th>API</th><th>Realtime</th><th>Best Fit</th></tr></thead>
          <tbody>{COMPARISON_DATA.map(r=><tr key={r.tool}>
            <td style={{fontWeight:600}}>{r.tool}</td>
            <td><span className="badge badge-blue">{r.cat}</span></td>
            <td>{r.self==='Yes'?<span style={{color:'var(--success)'}}>Yes</span>:<span style={{color:'var(--muted)'}}>No</span>}</td>
            <td className="cell-muted">{r.db}</td>
            <td className="cell-muted">{r.auth}</td>
            <td className="cell-muted">{r.api}</td>
            <td className="cell-muted">{r.rt}</td>
            <td className="cell-muted">{r.fit}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </div>
    <div className="panel"style={{padding:20}}>
      <h2 style={{margin:'0 0 10px',fontSize:14,fontWeight:650}}>Legend</h2>
      <div style={{display:'flex',flexWrap:'wrap',gap:16,fontSize:12,color:'var(--text-2)'}}>
        <div><span style={{color:'var(--success)',fontWeight:600}}>Native</span> = Built-in capability</div>
        <div><span style={{color:'var(--info)',fontWeight:600}}>Via integration</span> = Available through packages</div>
        <div><span style={{color:'var(--muted)',fontWeight:600}}>N/A</span> = Not relevant</div>
      </div>
    </div>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
